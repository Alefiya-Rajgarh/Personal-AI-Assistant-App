[tool.poetry]
name = "assistant-ai-backend"
version = "0.1.0"
description = "FastAPI backend for the Assistant AI monorepo."
authors = ["Assistant AI Team <dev@assistant-ai.local>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
asyncpg = "^0.29.0"
redis = "^5.0.4"
celery = "^5.4.0"
langchain = "^0.2.0"
langgraph = "^0.0.45"
openai = "^1.30.0"
firebase-admin = "^6.5.0"
google-auth = "^2.29.0"
httpx = "^0.27.0"
boto3 = "^1.34.100"
prometheus-client = "^0.20.0"
opentelemetry-sdk = "^1.24.0"
sentry-sdk = "^2.5.0"
python-jose = "^3.3.0"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
